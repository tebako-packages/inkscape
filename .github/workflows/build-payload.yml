name: build-payload
# Feedstock build: recipe → matrix build → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  matrix:
    name: emit
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.m.outputs.legs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: m
        run: |
          # The matrix is EMITTED from recipe.yml (YAML stays thin;
          # logic lives in tools/). tools/emit_matrix emits one leg per
          # (version × platform) in the recipe.
          echo "legs=$(ruby tools/emit_matrix recipe.yml)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache the vcpkg installed tree
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          # The recipe's port set builds from source on every cold run
          # (40-60+ min per leg). The workspace path is stable across
          # runs, so the installed tree's embedded absolute paths stay
          # valid. recipe.yml pins the vcpkg commit — the hash covers it.
          path: |
            .cache/vcpkg/installed
            .cache/vcpkg/downloads
            ~/.cache/vcpkg
            ~/Library/Caches/vcpkg
          key: feedstock-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('recipe.yml', 'tools/triplets/**') }}
          restore-keys: |
            feedstock-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Toolchain ruby (macOS)
        if: runner.os == 'macOS'
        # feedstock tools need ruby >= 3 (endless defs in tools/lib/tpkg.rb);
        # macOS system ruby is 2.6. brew puts /opt/homebrew/bin first in PATH.
        run: brew install ruby
      - name: Build ${{ matrix.version }} (${{ matrix.platform }})
        run: tools/build recipe.yml "${{ matrix.version }}" "${{ matrix.platform }}"
      # The imager: tfs-cli (in-process dwarfs-t writer), built from the
      # product repo — the feedstock never shells to mkdwarfs.
      - name: Checkout tebako (the imager) + dwarfs-rs (path dep)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tamatebako/tebako
          path: tebako-rs
      - name: Checkout dwarfs-rs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive
      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The dwarfs static triplet is derived from the runner, NOT the
        # recipe's payload triplet (this tree is for the imager's
        # dwarfs-t-sys build, not the inkscape deps).
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    t=x64-linux-static;   root=/home/runner/vcpkg-inst ;;
            Linux-ARM64)  t=arm64-linux-static; root=/home/runner/vcpkg-inst ;;
            macOS-X64)    t=x64-osx-static;     root=/Users/runner/vcpkg-inst ;;
            macOS-ARM64)  t=arm64-osx-static;   root=/Users/runner/vcpkg-inst ;;
          esac
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t "$t" "$root" \
            || echo "baseline miss — ports build normally"
          echo "DWARFS_RS_VCPKG_INSTALLED_DIR=$root" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: f14401ca0f2754347c3864da7488a9b955b4e47a
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root
      - name: Cache vcpkg package archives
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/vcpkg
          key: vcpkg-archives-${{ runner.os }}-feedstock-${{ hashFiles('dwarfs-rs/dwarfs-t/vcpkg.json') }}
          restore-keys: |
            vcpkg-archives-${{ runner.os }}-feedstock-
      - name: Build tfs-cli (the imager)
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          SQFS_SYS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          cargo build --release --manifest-path tebako-rs/Cargo.toml -p tfs-cli
          echo "$GITHUB_WORKSPACE/tebako-rs/target/release" >> "$GITHUB_PATH"
      - name: Stage artifact
        env:
          TFS_CLI: tfs
        run: tools/stage "out/${{ matrix.platform }}" "${{ matrix.platform }}"
      - name: Boot-smoke
        run: tools/boot_smoke "out/${{ matrix.platform }}" || true  # advisory until phase A proves
      - name: Upload payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payload-${{ matrix.platform }}
          path: out/${{ matrix.platform }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Collect payloads
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: payload-*
          path: out/
          merge-multiple: false
      - name: Restore layout
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      - name: Publish payloads + registry
        run: tools/publish  # artifacts per triplet + SHA256SUMS + registry yaml pinned
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
