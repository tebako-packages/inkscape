name: build-payload
# Feedstock build: recipe → matrix build → boot-smoke → release.
# Conventions: docs/conventions.md in tebako-packages/index.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One run per branch/PR-head at a time: pushing to a branch with an open
# PR would otherwise run every job twice (push + pull_request events);
# a new run cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  matrix:
    name: emit
    runs-on: ubuntu-24.04
    outputs:
      legs: ${{ steps.m.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: m
        run: |
          # The matrix is EMITTED from recipe.yml (YAML stays thin;
          # logic lives in tools/). tools/emit_matrix emits one leg per
          # (version × platform) in the recipe.
          echo "legs=$(ruby tools/emit_matrix recipe.yml)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }}
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the vcpkg installed tree (POSIX legs)
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The recipe's port set builds from source on every cold run
          # (40-60+ min per leg). The workspace path is stable across
          # runs, so the installed tree's embedded absolute paths stay
          # valid. recipe.yml pins the vcpkg commit — the hash covers it.
          path: |
            .cache/vcpkg/installed
            .cache/vcpkg/downloads
            ~/.cache/vcpkg
            ~/Library/Caches/vcpkg
          key: feedstock-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('recipe.yml', 'tools/triplets/**') }}
          restore-keys: |
            feedstock-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the vcpkg installed tree (windows leg)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # The windows leg's vcpkg root is D:\tpkg-cache (TPKG_CACHE): a
          # SHORT root — vcpkg buildtrees + boost's deep obj paths
          # otherwise flirt with MAX_PATH under the workspace prefix.
          # ~/AppData/Local/vcpkg is vcpkg's default binary-archive cache.
          path: |
            D:\tpkg-cache\vcpkg\installed
            D:\tpkg-cache\vcpkg\downloads
            ~/AppData/Local/vcpkg
          key: feedstock-vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('recipe.yml', 'tools/triplets/**') }}
          restore-keys: |
            feedstock-vcpkg-${{ runner.os }}-${{ runner.arch }}-
      - name: Toolchain ruby (macOS)
        if: runner.os == 'macOS'
        # feedstock tools need ruby >= 3 (endless defs in tools/lib/tpkg.rb);
        # macOS system ruby is 2.6. brew puts /opt/homebrew/bin first in PATH.
        run: brew install ruby
      - name: Set up MSys2 (ucrt64 toolchain + build tools)
        if: matrix.platform == 'x86_64-windows-ucrt'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          # THE windows toolchain (the same ucrt64 gcc family the ruby
          # runtime factory and the vcpkg baseline use — never choco gcc)
          # + the build tools the closed PATH exposes. binutils' unprefixed
          # objdump.exe/strip.exe (the closure's tools) ride in toolchain.
          # The GNOME platform stack is recipe data — next step.
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-ruby
      - name: GNOME platform stack (pacman, ucrt64)
        if: matrix.platform == 'x86_64-windows-ucrt'
        shell: msys2 {0}
        # pacman is provisioning, not build logic: it runs in its native
        # msys2 environment (the build steps' closed PATH keeps the msys
        # /usr/bin out — the vcpkg-autotools ABI clash rule). The package
        # list is recipe data (build.pacman_packages).
        run: tools/pacman_install recipe.yml
      - name: Build ${{ matrix.version }} (${{ matrix.platform }})
        if: matrix.platform != 'x86_64-windows-ucrt'
        run: tools/build recipe.yml "${{ matrix.version }}" "${{ matrix.platform }}"
      - name: Build ${{ matrix.version }} (${{ matrix.platform }}, ucrt64)
        if: matrix.platform == 'x86_64-windows-ucrt'
        shell: bash
        env:
          # short vcpkg root (the MAX_PATH rule — see the windows cache step)
          TPKG_CACHE: D:\tpkg-cache
        # the closed ucrt64 environment (one toolchain, closed PATH, the
        # make toolshim, cargo/botan/bindgen steering) is tools/ci_run.
        run: tools/ci_run ruby tools/build recipe.yml "${{ matrix.version }}" "${{ matrix.platform }}"
      # The imager: the PUBLISHED tfs CLI (in-process dwarfs-t writer) —
      # releases are the interface; the feedstock never builds the tebako
      # stack from source and never shells to mkdwarfs. Every version and
      # digest flows from recipe.yml's tools block via tools/pins.rb (this
      # workflow carries NO literals), cross-checked against the release's
      # own SHA256SUMS at fetch time.
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        shell: bash
        run: ruby tools/pins.rb "${{ matrix.asset_platform }}" --env >> "$GITHUB_ENV"
      - name: Fetch the imager (pinned by recipe.yml, sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sSfL --retry 3 -o ".packager/${TFS_ASSET}" "$base/${TFS_ASSET}"
          curl -sSfL --retry 3 -o .packager/SHA256SUMS "$base/SHA256SUMS"
          echo "${TFS_SHA256}  .packager/${TFS_ASSET}" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          # The pin must agree with the release's own sums (both anchored).
          got=$(awk -v a="$TFS_ASSET" '$2 == a {print $1}' .packager/SHA256SUMS)
          [ "$got" = "$TFS_SHA256" ] || { echo "::error::pin mismatch for $TFS_ASSET: recipe.yml=$TFS_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x ".packager/${TFS_ASSET}"
          if [ "${{ matrix.platform }}" = "x86_64-windows-ucrt" ]; then
            cp ".packager/${TFS_ASSET}" .packager/tfs.exe
          else
            cp ".packager/${TFS_ASSET}" .packager/tfs
            echo "$GITHUB_WORKSPACE/.packager" >> "$GITHUB_PATH"
          fi
      - name: Stage artifact
        if: matrix.platform != 'x86_64-windows-ucrt'
        env:
          TFS_CLI: tfs
        run: tools/stage "out/${{ matrix.platform }}" "${{ matrix.platform }}"
      - name: Stage artifact (windows)
        if: matrix.platform == 'x86_64-windows-ucrt'
        shell: bash
        env:
          # an explicit path, not a PATH lookup: tools/ci_run's closed PATH
          # (by design) drops GITHUB_PATH-added dirs
          TFS_CLI: .packager/tfs.exe
        run: tools/ci_run ruby tools/stage "out/${{ matrix.platform }}" "${{ matrix.platform }}"
      - name: Boot-smoke
        if: matrix.platform != 'x86_64-windows-ucrt'
        run: tools/boot_smoke "out/${{ matrix.platform }}" || true  # advisory until phase A proves
      - name: Boot-smoke (windows — the acceptance gate)
        if: matrix.platform == 'x86_64-windows-ucrt'
        shell: bash
        env:
          TFS_CLI: .packager/tfs.exe
        # NOT advisory on windows: --version + SVG->PNG/PDF exports from the
        # extracted image with an empty environment, then the objdump sweep.
        run: tools/ci_run ruby tools/boot_smoke "out/${{ matrix.platform }}"
      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.platform }}
          path: out/${{ matrix.platform }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/.packager/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The publisher is the product repo's published CLI (same release
      # line as the imager), pinned by recipe.yml's tools block — never a
      # from-source build, no literals in this workflow. tebako publish
      # also needs the dispatcher (it refuses to register shims pointing
      # at nothing, exit 74) — fetch both, both pinned, both cross-checked
      # against the release's SHA256SUMS.
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        run: ruby tools/pins.rb macos-arm64 --env >> "$GITHUB_ENV"
      - name: Fetch the publisher (pinned by recipe.yml, sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o .packager/tebako "$base/$TEBAKO_ASSET"
          curl -sL --fail -o .packager/tebako-shim "$base/$SHIM_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  .packager/tebako" | shasum -a 256 -c -
          echo "$SHIM_SHA256  .packager/tebako-shim" | shasum -a 256 -c -
          for pair in "$TEBAKO_ASSET:$TEBAKO_SHA256" "$SHIM_ASSET:$SHIM_SHA256"; do
            asset="${pair%%:*}"; want="${pair##*:}"
            got=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS)
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: recipe.yml=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod +x .packager/tebako .packager/tebako-shim
          .packager/tebako --help > /dev/null
      # The payload filenames come from tools/build's own naming
      # (<name>-<upstream.version>-<triplet>.tfs — recipe values, NOT the
      # git tag: a tag may carry a feedstock revision suffix like 1.4.3-2
      # while the artifact keeps the upstream version).
      - name: Publish (release + registry + clean-cache verify)
        shell: bash
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" publish --name "$PKG_NAME" \
            --release "tfs:github:tebako-packages/inkscape:${{ github.ref_name }}" \
            --payload "aarch64-macos=out/aarch64-macos/$PKG_NAME-$PKG_VERSION-aarch64-macos.tfs" \
            --payload "x86_64-linux-gnu=out/x86_64-linux-gnu/$PKG_NAME-$PKG_VERSION-x86_64-linux-gnu.tfs" \
            --payload "x86_64-windows-ucrt=out/x86_64-windows-ucrt/$PKG_NAME-$PKG_VERSION-x86_64-windows-ucrt.tfs" \
            --registry-out "$GITHUB_WORKSPACE/tpkg-registry.yaml"
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry"
          # force-with-lease on the bot branch: a re-publish re-creates it
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
