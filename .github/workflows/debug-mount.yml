name: debug-mount
# One-off diagnostic: why does the dwarfs-t fuse driver not mount on the
# GHA runner? Downloads the payload artifact from a previous run and tries
# the mount verbosely. Delete once the answer is in.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id whose payload-x86_64-linux-gnu artifact to use"
        required: true
        default: "30217572017"

permissions:
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: payload-x86_64-linux-gnu
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: work/
      - name: Inspect
        run: |
          ls -la work/ work/dwarfs-t-bin/ || true
          file work/dwarfs-t-bin/* || true
          work/dwarfs-t-bin/dwarfs --version || true
          ls -l /dev/fuse || echo "NO /dev/fuse"
          cat /proc/filesystems | grep -i fuse || echo "fuse not in /proc/filesystems"
      - name: Install fuse3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fuse3
          ls -l /dev/fuse
          command -v fusermount3 && ls -l "$(command -v fusermount3)"
      - name: Try mount (daemonized, driver default)
        run: |
          set -x
          mkdir -p mnt
          timeout 60 work/dwarfs-t-bin/dwarfs work/inkscape-1.4.3-x86_64-linux-gnu.dwarfs mnt; echo "exit=$?"
          sleep 2
          ls mnt/ | head; mount | grep -i dwarfs || echo "not in mount table"
      - name: Try mount with -f (argtable behavior probe)
        run: |
          set -x
          mkdir -p mnt2
          timeout 20 work/dwarfs-t-bin/dwarfs -f work/inkscape-1.4.3-x86_64-linux-gnu.dwarfs mnt2; echo "exit=$?"
          ls mnt2/ | head || true
